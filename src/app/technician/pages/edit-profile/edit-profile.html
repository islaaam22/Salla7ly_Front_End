<div class="edit-page" dir="rtl">
  <!-- Back -->
  <a routerLink="/technician/profile" class="edit-back-btn">
    <i class="fa-solid fa-arrow-right"></i>
    رجوع
  </a>

  <!-- Header -->
  <div class="page-header-wrap">
    <h1 class="page-title">تعديل الملف الشخصي</h1>
    <p class="page-sub">تحديث بياناتك الأساسية (الاسم، البريد، الهاتف، العنوان وكلمة المرور)</p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="profile-loading">
    <div class="spinner-border" role="status" style="color: #e8620a"></div>
    <p>جاري التحميل...</p>
  </div>

  <div *ngIf="!loading" class="edit-page-grid">
    <!-- RIGHT (main col): Profile Form -->
    <div class="edit-card">
      <div class="edit-card-header">
        البيانات الأساسية
        <i class="fa-solid fa-user-pen"></i>
      </div>



      <!-- Full Name -->
      <div class="edit-field">
        <label class="edit-label me-3"> الاسم الكامل <i class="fa-regular fa-user"></i> </label>
        <input type="text" class="edit-input" [(ngModel)]="fullName" name="fullName" />
      </div>

      <!-- Email -->
      <div class="edit-field">
        <label class="edit-label  me-3">  البريد الإلكتروني <i class="fa-regular fa-envelope"></i> </label>
        <input
          type="email"
          class="edit-input"
          [(ngModel)]="email"
          name="email"
          style="direction: ltr; text-align: right"
        />
      </div>

      <!-- Phone -->
      <div class="edit-field">
        <label class="edit-label me-3">رقم الهاتف <i class="fa-solid fa-phone"></i> </label>
        <input
          type="text"
          class="edit-input"
          [(ngModel)]="phoneNumber"
          name="phoneNumber"
          placeholder="+20 1xx xxx xxxx"
          style="direction: ltr; text-align: right"
        />
      </div>

      <!-- Experience -->
      <div class="edit-field">
        <label class="edit-label me-3">سنوات الخبرة <i class="fa-solid fa-briefcase"></i> </label>
        <input
          type="number"
          class="edit-input"
          [(ngModel)]="experienceYears"
          name="experienceYears"
          min="0"
          max="50"
        />
      </div>

      <!-- Bio -->
      <div class="edit-field">
        <label class="edit-label me-3"> نبذة عنك <i class="fa-regular fa-id-card"></i></label>
        <textarea
          class="edit-textarea"
          [(ngModel)]="bio"
          name="bio"
          rows="3"
          placeholder="اكتب نبذة قصيرة عن خبرتك..."
        ></textarea>
      </div>


      <div *ngIf="errorMsg" class="edit-alert-danger">
        <i class="fa-solid fa-triangle-exclamation"></i>
        {{ errorMsg }}
      </div>
      <div *ngIf="successMsg" class="edit-alert-success">
        <i class="fa-solid fa-circle-check"></i>
        {{ successMsg }}
      </div>

      <button class="btn-save" [disabled]="saving" (click)="onSaveProfile()">
        <i class="fa-regular fa-floppy-disk"></i>
        {{ saving ? 'جاري الحفظ...' : 'حفظ التعديلات' }}
      </button>
    </div>

  </div>
</div>
