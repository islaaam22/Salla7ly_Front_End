<div class="dashboard-container">

  <!-- Header -->
  <header class="dashboard-header rounded-4">
    <div class="header-center">
      <div class="header-eyebrow">
        <i class="fa-solid fa-shield-halved"></i>
        لوحة التحكم
      </div>
      <h1 class="page-title">لوحة المشرف</h1>
      <p class="page-subtitle">نظرة شاملة على المنصة وأدائها</p>
    </div>
  </header>

  <!-- Loading -->
  <div *ngIf="loading" class="loading-container">
    <div class="loading-spinner">
      <i class="fas fa-spinner fa-spin"></i>
      <p>جاري تحميل البيانات...</p>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMsg && !loading" class="error-container">
    <div class="error-message">
      <i class="fas fa-exclamation-circle"></i>
      <p>{{ errorMsg }}</p>
      <button class="retry-btn" (click)="refreshData()">
        <i class="fas fa-redo"></i>
        إعادة المحاولة
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div *ngIf="!loading && !errorMsg" class="main-content">

    <!-- Stats -->
    <div class="stats-grid">
      <div
        *ngFor="let stat of stats"
        class="stat-card"
        [ngStyle]="{'--card-color': stat.color}"
      >
        <div class="stat-icon" [ngStyle]="{'background': stat.color + '18', 'color': stat.color}">
          <i class="fas" [ngClass]="stat.icon"></i>
        </div>
        <div class="stat-info">
          <p class="stat-title">{{ stat.title }}</p>
          <h3 class="stat-value">
            <span *ngIf="stat.prefix">{{ stat.prefix }}</span>
            {{ stat.value | number:'1.0-0' }}
            <span *ngIf="stat.suffix">{{ stat.suffix }}</span>
          </h3>
        </div>
        <div class="stat-card-accent"></div>
      </div>
    </div>

    <!-- Management -->
    <div class="management-grid">
      <div
        *ngFor="let section of managementSections"
        class="management-card"
        [ngStyle]="{'--card-color': section.color}"
      >
        <div class="management-header">
          <div
            class="management-icon"
            [ngStyle]="{'background': section.color + '15', 'color': section.color}"
          >
            <i class="fas" [ngClass]="section.icon"></i>
          </div>
          <h3 class="management-title">{{ section.title }}</h3>
        </div>
        <p class="management-description">{{ section.description }}</p>
        <button class="view-all-btn" (click)="navigateTo(section.link)">
          عرض الكل
          <i class="fas fa-arrow-left"></i>
        </button>
      </div>
    </div>

  </div>
</div>
