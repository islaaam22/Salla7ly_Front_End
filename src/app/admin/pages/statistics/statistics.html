<div dir="rtl">

  <!-- Header -->
  <div class="text-end mb-4">
    <h1 class="fw-bold" style="font-size:32px;color:#0f172a;">
      الإحصائيات والتحليلات
    </h1>
    <p class="text-muted" style="font-size:16px;">
      رؤية شاملة لأداء المنصة.
    </p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3 text-muted">جاري التحميل...</p>
  </div>

  <!-- Error -->
  <div *ngIf="errorMsg && !loading" class="alert alert-danger text-end" style="border-radius:14px;">
    {{ errorMsg }}
  </div>

  <div *ngIf="!loading && !errorMsg">

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
      <div class="col-3" *ngFor="let card of statCards">
        <div class="bg-white rounded-4 p-4" style="border:1px solid #e8edf2;">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <div class="rounded-circle d-flex justify-content-center align-items-center"
                 [style.background]="card.iconBg"
                 style="width:42px;height:42px;">
              <i [class]="card.icon" [style.color]="card.iconColor" style="font-size:16px;"></i>
            </div>
            <span class="fw-semibold" style="color:#16a34a;font-size:14px;">
              {{ card.change }}
            </span>
          </div>
          <div class="text-end">
            <div class="fw-bold" style="font-size:28px;color:#0f172a;">
              {{ card.value }}
            </div>
            <div class="text-muted" style="font-size:14px;">
              {{ card.label }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-3">

      <!-- Category Distribution -->
      <div class="col-5">
        <div class="bg-white rounded-4 p-4 h-100" style="border:1px solid #e8edf2;">
          <h5 class="fw-bold text-end mb-4" style="color:#0f172a;">
            توزيع الفئات
          </h5>

          <div *ngFor="let cat of categories" class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="fw-semibold" style="font-size:14px;color:#0f172a;">{{ cat.percent }}%</span>
              <span class="text-muted" style="font-size:14px;">{{ cat.name }}</span>
            </div>
            <div class="progress" style="height:8px;border-radius:6px;background:#f0f4f8;">
              <div class="progress-bar"
                   [style.width]="cat.percent + '%'"
                   style="background:linear-gradient(90deg,#3eacdf,#1787e0);border-radius:6px;">
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Monthly Revenue Chart -->
      <div class="col-7">
        <div class="bg-white rounded-4 p-4 h-100" style="border:1px solid #e8edf2;">
          <h5 class="fw-bold text-end mb-4" style="color:#0f172a;">
            الإيرادات الشهرية (ألف ج)
          </h5>

          <div class="d-flex justify-content-between align-items-end gap-3" style="height:220px;">
            <div *ngFor="let m of monthlyRevenue" class="d-flex flex-column align-items-center flex-grow-1">
              <div class="w-100 d-flex flex-column justify-content-end" style="height:170px;">
                <div class="rounded-top-3"
                     [style.height.%]="barHeight(m.value)"
                     style="background:linear-gradient(180deg,#3eacdf,#1787e0);width:100%;border-radius:8px 8px 0 0;min-height:4px;">
                </div>
              </div>
              <div class="fw-bold mt-2" style="font-size:15px;color:#0f172a;">{{ m.value }}</div>
              <div class="text-muted" style="font-size:13px;">{{ m.month }}</div>
            </div>
          </div>

        </div>
      </div>

    </div>

  </div>

</div>
