<aside
  class="d-flex flex-column bg-white p-3 border-end position-sticky top-0"
  style="width: 280px; height: 100vh; border-inline-end: 2px solid #e9ecef !important; position: sticky; top: 0;"
>
  <!-- Brand -->
  <div class="d-flex align-items-center justify-content-start gap-2 mb-4 pb-3 border-bottom">
    <span
      class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white"
      style="width: 38px; height: 38px"
    >
      <i class="fa-solid fa-wrench"></i>
    </span>
    <h4 class="fw-bold mb-0">صلّحلي</h4>
  </div>

  <!-- Nav -->
  <nav class="nav-section">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.link"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>{{ item.label }}</span>
        <i [class]="item.icon"></i>
      </a>
    </nav>

  <!-- Footer -->
  <div class="mt-auto  border-top">
    <div class="d-flex align-items-center justify-content-start gap-2 mb-3 mt-3">
      <span
        class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white fw-bold"
        style="width: 40px; height: 40px"
      >
        {{ userInitial }}
      </span>

      <div class="text-end">
        <div class="fw-semibold">{{ userName }}</div>
        <div class="text-muted small">مشرف</div>
      </div>
    </div>

    <button
      (click)="logout()"
      class="btn btn-danger border w-100 d-flex align-items-center justify-content-center gap-2"
    >
      <span>→</span>
      <span>تسجيل الخروج</span>
    </button>
  </div>
</aside>
