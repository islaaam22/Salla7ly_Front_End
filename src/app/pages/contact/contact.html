<app-navbar></app-navbar>

<section class="py-5" dir="rtl">

  <div class="container">

    <div class="text-center mb-5">

      <p class="text-primary fw-semibold mb-3">
        تواصل معنا
      </p>

      <h1 class="fw-bold mb-3">
        نحن في خدمتك
      </h1>

      <p class="text-muted fs-5">
        فريق الدعم متاح طوال أيام الأسبوع للرد على استفساراتك.
      </p>

    </div>

    <div class="row g-4 flex-lg-row-reverse">

      <!-- الفورم -->

      <div class="col-lg-8 ">

        <div class="card p-4 h-100">

          <form (ngSubmit)="onSubmit()">

            <div class="row mb-4">

              <div class="col-md-6">
                <label class="form-label">الاسم</label>

                <input
                  type="text"
                  class="form-control"
                  name="name"
                  [(ngModel)]="form.name"
                  placeholder="اكتب اسمك">
                  <div *ngIf="nameError" class="text-danger small mt-1 text-end">{{ nameError }}</div>
              </div>

              <div class="col-md-6">
                <label class="form-label">البريد الإلكتروني</label>

                <input
                  type="email"
                  class="form-control"
                  name="email"
                  [(ngModel)]="form.email"
                  placeholder="email@example.com">
                  <div *ngIf="emailError" class="text-danger small mt-1 text-end">{{ emailError }}</div>
              </div>

            </div>

            <div class="mb-4">

              <label class="form-label">
                الموضوع
              </label>

              <input
                type="text"
                class="form-control"
                name="subject"
                [(ngModel)]="form.subject"
                placeholder="موضوع الرسالة">
                <div *ngIf="subjectError" class="text-danger small mt-1 text-end">{{ subjectError }}</div>
            </div>

            <div class="mb-4">

              <label class="form-label">
                الرسالة
              </label>

              <textarea
                rows="6"
                class="form-control"
                name="message"
                [(ngModel)]="form.message"
                placeholder="اكتب رسالتك هنا...">
              </textarea>
              <div *ngIf="messageError" class="text-danger small mt-1 text-end">{{ messageError }}</div>
            </div>

            <div *ngIf="successMsg"
                 class="alert alert-success">
              {{ successMsg }}
            </div>

            <div class="text-end">

              <button
                type="submit"
                class="btn btn-primary rounded-pill px-5 py-3"
                [disabled]="loading">

                <i class="fa-solid fa-paper-plane me-2"></i>

                {{ loading ? 'جاري الإرسال...' : 'إرسال الرسالة' }}

              </button>

            </div>

          </form>

        </div>

      </div>

      <!-- بيانات التواصل -->

      <div class="col-lg-4 order-1 order-lg-2">

        <div class="d-flex flex-column gap-4">

          <div class="card p-4">

            <div class="d-flex justify-content-between align-items-center">

              <div class="contact-icon bg-primary bg-opacity-10">
                <i class="fa-regular fa-envelope text-primary"></i>
              </div>

              <div class="text-end w-100">
                <small class="text-muted d-block">
                  البريد الإلكتروني
                </small>

                <h5 class="mb-0 fw-bold">
                  support@sallahly.eg
                </h5>
              </div>

            </div>

          </div>

          <div class="card p-4">

            <div class="d-flex justify-content-between align-items-center">

              <div class="contact-icon bg-primary bg-opacity-10">
                <i class="fa-solid fa-phone text-primary"></i>
              </div>

              <div class="text-end w-100">
                <small class="text-muted d-block">
                  الهاتف
                </small>

                <h5 class="mb-0 fw-bold">
                  +20 100 000 0000
                </h5>
              </div>

            </div>

          </div>

          <div class="card p-4">

            <div class="d-flex justify-content-between align-items-center">

              <div class="contact-icon bg-primary bg-opacity-10">
                <i class="fa-solid fa-location-dot text-primary"></i>
              </div>

              <div class="text-end w-100">
                <small class="text-muted d-block">
                  العنوان
                </small>

                <h5 class="mb-0 fw-bold">
                  القاهرة، جمهورية مصر العربية
                </h5>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

<app-footer></app-footer>
