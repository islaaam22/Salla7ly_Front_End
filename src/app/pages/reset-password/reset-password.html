<div class="container-fluid vh-100 p-0">
  <div class="row h-100 m-0">

    <!-- Left Side: Form -->
    <div class="col-6 d-flex justify-content-center align-items-center"
         style="background:#f5f7fa;">

      <div style="width:540px;">

        <div class="mb-5">
          <h2 class="fw-bold text-end mb-1"
              style="font-size:33px;color:#0f172a;">
            تعيين كلمة مرور جديدة
          </h2>
          <p class="text-end text-muted" style="font-size:18px;">
            يجب أن تكون كلمة المرور الجديدة مختلفة عن السابقة.
          </p>
        </div>

        <form (ngSubmit)="onSubmit()">

          <!-- New Password -->
          <div class="mb-4">
            <label class="form-label fw-bold w-100 text-end mb-2">
              كلمة المرور الجديدة
            </label>
            <div class="input-group" style="direction:ltr;">
              <button type="button" class="input-group-text"
                      (click)="showPassword = !showPassword"
                      style="border-radius:18px 0 0 18px;border:1px solid #d9e1e8;
                             border-left:none;background:#fff;height:60px;cursor:pointer;">
                <i class="fa-regular"
                   [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                   style="color:#888;"></i>
              </button>
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control text-end"
                [(ngModel)]="password"
                name="password"
                placeholder="••••••••"
                required
                style="height:60px;border-radius:0 18px 18px 0;
                       border:1px solid #d9e1e8;border-right:none;padding:0 16px;">
            </div>
            <div *ngIf="passwordError" class="text-danger small mt-1 text-end">
              {{ passwordError }}
            </div>

            <!-- Password Strength Bar -->
            <div *ngIf="password" class="mt-2">
              <div class="progress" style="height:6px;border-radius:4px;">
                <div class="progress-bar"
                     [style.width]="strengthPercent + '%'"
                     [style.background]="strengthColor"
                     style="transition:width 0.3s;border-radius:4px;">
                </div>
              </div>
              <small class="d-block text-end mt-1"
                     [style.color]="strengthColor">
                {{ strengthLabel }}
              </small>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="mb-4">
            <label class="form-label fw-bold w-100 text-end mb-2">
              تأكيد كلمة المرور
            </label>
            <div class="input-group" style="direction:ltr;">
              <button type="button" class="input-group-text"
                      (click)="showConfirm = !showConfirm"
                      style="border-radius:18px 0 0 18px;border:1px solid #d9e1e8;
                             border-left:none;background:#fff;height:60px;cursor:pointer;">
                <i class="fa-regular"
                   [ngClass]="showConfirm ? 'fa-eye-slash' : 'fa-eye'"
                   style="color:#888;"></i>
              </button>
              <input
                [type]="showConfirm ? 'text' : 'password'"
                class="form-control text-end"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                placeholder="••••••••"
                required
                style="height:60px;border-radius:0 18px 18px 0;
                       border:1px solid #d9e1e8;border-right:none;padding:0 16px;">
            </div>
            <div *ngIf="confirmError" class="text-danger small mt-1 text-end">
              {{ confirmError }}
            </div>
          </div>

          <div *ngIf="errorMsg"
               class="alert alert-danger text-end mb-3"
               style="border-radius:14px;">
            {{ errorMsg }}
          </div>

          <button
            type="submit"
            class="btn w-100 text-white fw-bold"
            [disabled]="loading"
            style="height:60px;border:none;border-radius:18px;font-size:20px;
                   background:linear-gradient(90deg,#3eacdf,#4290d0);">
            {{ loading ? 'جاري الحفظ...' : 'حفظ كلمة المرور الجديدة' }}
          </button>

        </form>

        <p class="text-center mt-4" style="font-size:16px;">
          <a routerLink="/login" class="text-secondary text-decoration-none">
            <i class="fa-solid fa-arrow-right me-1"></i> العودة لتسجيل الدخول
          </a>
        </p>

      </div>
    </div>

    <!-- Right Side: Branding Panel -->
    <div class="col-6 d-flex flex-column"
         style="background:linear-gradient(135deg,#1787e0 0%,#30aaaa 100%);padding:50px;">

      <div class="d-flex justify-content-end align-items-center gap-3">
        <span class="text-white fw-bold" style="font-size:22px;">صلّحلي</span>
        <div class="rounded-circle d-flex justify-content-center align-items-center"
             style="width:42px;height:42px;background:rgba(255,255,255,.18);">
          <i class="fa-solid fa-wrench text-white"></i>
        </div>
      </div>

      <div class="my-auto text-end pe-5">

        <div class="d-flex justify-content-end mb-4">
          <div class="rounded-circle d-flex justify-content-center align-items-center"
               style="width:100px;height:100px;background:rgba(255,255,255,.2);">
            <i class="fa-solid fa-lock-open text-white" style="font-size:40px;"></i>
          </div>
        </div>

        <h1 class="text-white fw-bold mb-4" style="font-size:40px;line-height:1.1;">
          أنشئ كلمة مرور
          <br>قوية وآمنة
        </h1>
        <p class="text-white" style="font-size:22px;opacity:.9;line-height:1.8;">
          .اختر كلمة مرور يصعب تخمينها لحماية حسابك
        </p>
      </div>

      <div class="text-end">
        <span class="text-white" style="opacity:.6;font-size:18px;">صلّحلي ٢٠٢٦ ©</span>
      </div>

    </div>

  </div>
</div>
