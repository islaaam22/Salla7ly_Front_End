<div class="container py-4" dir="rtl">

  <!-- header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">الإشعارات</h3>
    <span *ngIf="unreadCount() > 0" class="badge bg-primary rounded-pill">
      {{ unreadCount() }} جديد
    </span>
  </div>

  <!-- empty state -->
  <div *ngIf="notifications().length === 0" class="text-center text-muted py-5">
    <div class="fs-1 mb-2">🔔</div>
    <p>لا توجد إشعارات حالياً.</p>
  </div>

  <!-- list -->
  <div class="d-flex flex-column gap-2">
    <div *ngFor="let n of notifications()"
         (click)="onClick(n)"
         class="card border-0 shadow-sm"
         style="cursor: pointer;"
         [class.bg-light]="!n.isRead">
      <div class="card-body d-flex align-items-start gap-3 p-3">

        <!-- icon bubble -->
        <span class="badge bg-primary-subtle text-primary fs-5 p-2 rounded-circle">
          {{ iconFor(n.type) }}
        </span>

        <!-- text -->
        <div class="flex-grow-1 text-end">
          <div class="fw-bold" [class.text-primary]="!n.isRead">{{ n.title }}</div>
          <div class="text-muted small">{{ n.body }}</div>
          <div class="text-muted" style="font-size: 12px;">{{ n.sentAt | date:'short' }}</div>
        </div>

        <!-- unread dot -->
        <span *ngIf="!n.isRead"
              class="rounded-circle bg-primary mt-1"
              style="width: 10px; height: 10px;"></span>

      </div>
    </div>
  </div>

</div>
