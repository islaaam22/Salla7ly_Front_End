<div class="d-flex flex-column h-100 bg-white">
  <!-- Header -->
  <div class="p-3 border-bottom">
    <h6 class="fw-bold mb-3" style="color: #1a1a2e">
      <i class="fa-regular fa-comment-dots me-2" style="color: #1aacdc"></i>
      المحادثات
    </h6>
    <div class="position-relative">
      <input
        type="text"
        class="form-control form-control-sm pe-4 rounded-pill"
        placeholder="ابحث عن محادثة..."
      />
      <i
        class="fa-solid fa-magnifying-glass position-absolute text-muted"
        style="left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px"
      ></i>
    </div>
  </div>

  <!-- Conversations -->
  <div class="overflow-auto flex-grow-1">
    <div
      *ngFor="let conv of conversation"
      class="d-flex align-items-center gap-3 p-3 border-bottom conv-item"
      (click)="conversationSelected.emit(conv)"
      role="button"
    >
      <!-- Avatar -->
      <div
        class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white flex-shrink-0"
        style="width: 48px; height: 48px; background: #1aacdc; font-size: 20px"
      >
        {{ conv.otherPartyName[0] || '?' }}
      </div>

      <!-- Info -->
      <div class="flex-grow-1 overflow-hidden">
        <div class="d-flex justify-content-between align-items-center">
          <span class="fw-semibold text-truncate" style="color: #1a1a2e">
            {{ conv.otherPartyName }}
          </span>
          <small class="text-muted flex-shrink-0 ms-2" style="font-size: 11px">
            {{ conv.lastMessageTime }}
          </small>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-1">
          <small class="text-muted text-truncate">{{ conv.lastMessage }}</small>
          <span
            *ngIf="conv.unreadCount > 0"
            class="badge rounded-pill ms-2 flex-shrink-0"
            style="background: #1aacdc; font-size: 11px"
          >
            {{ conv.unreadCount }}
          </span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="conversation.length === 0" class="text-center text-muted p-5">
      <i class="fa-solid fa-envelope fs-2 d-block mb-2"></i>
      لا توجد محادثات
    </div>
  </div>
</div>
