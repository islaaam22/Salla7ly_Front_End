<div class="convlist-wrap">

  <!-- Header -->
  <div class="convlist-header">
    <h6 class="convlist-title">
      <i class="fa-regular fa-comment-dots"></i>
      المحادثات
    </h6>
    <div class="convlist-search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" class="convlist-search-input" placeholder="ابحث عن محادثة..." />
    </div>
  </div>

  <!-- Conversations -->
  <div class="convlist-scroll">
    <div
      *ngFor="let conv of conversation"
      class="conv-item"
      (click)="conversationSelected.emit(conv)"
      role="button"
    >
      <!-- Avatar -->
      <div class="conv-avatar">
        {{ conv.otherPartyName[0] || '?' }}
      </div>

      <!-- Info -->
      <div class="conv-info">
        <div class="conv-top-row">
          <span class="conv-name">{{ conv.otherPartyName }}</span>
          <small class="conv-time">{{ conv.lastMessageTime }}</small>
        </div>
        <div class="conv-bottom-row">
          <small class="conv-last-msg">{{ conv.lastMessage }}</small>
          <span *ngIf="conv.unreadCount > 0" class="conv-unread-badge">
            {{ conv.unreadCount }}
          </span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="conversation.length === 0" class="convlist-empty">
      <i class="fa-solid fa-envelope"></i>
      لا توجد محادثات
    </div>
  </div>
</div>
