<div class="container-fluid vh-100 p-0 overflow-hidden" >
  <div class="row g-0 h-100">
    <!-- القائمة - اليمين -->
    <div class="col-4 h-100 border-start">
      <app-conversation-list
        [conversation]="conversations"
        (conversationSelected)="onSelectConversation($event)"
      >
      </app-conversation-list>
    </div>

    <!-- الشات - اليسار -->
    <div class="col-8 h-100">
      <app-chat-window
        *ngIf="selectedConversation"
        [conversation]="selectedConversation!"
        [messages]="messages"
      >
      </app-chat-window>

      <div
        *ngIf="!selectedConversation"
        class="h-100 d-flex flex-column align-items-center justify-content-center"
      >
        <i class=" fa-solid fa-comment mb-3 " style="font-size: 64px; color: #1aacdc"></i>
        <p class="text-muted fs-5">اختر محادثة للبدء</p>
      </div>
    </div>
  </div>
</div>
