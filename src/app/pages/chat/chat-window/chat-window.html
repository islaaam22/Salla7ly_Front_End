<div class="chat-window-standalone">

  <!-- Header -->
  <div class="chat-window-header">
    <div class="conv-avatar conv-avatar-lg">
      {{ conversation.otherPartyName[0] }}
    </div>
    <div class="chat-header-info">
      <div class="chat-header-name">{{ conversation.otherPartyName }}</div>
      <small class="chat-header-status">
        <span *ngIf="isTyping"><i class="fa-regular fa-comment-dots"></i> جاري الكتابة...</span>
        <span *ngIf="!isTyping">متصل الآن</span>
      </small>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages-area">
    <app-message-buddle *ngFor="let msg of messages" [message]="msg"></app-message-buddle>

    <div *ngIf="messages.length === 0" class="chat-no-messages">
      <i class="fa-regular fa-comment-dots"></i>
      ابدأ المحادثة
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-bar">
    <label class="chat-attach-btn" title="إرفاق ملف">
      <i class="fa-solid fa-paperclip"></i>
      <input type="file" hidden (change)="onFileSelected($event)" />
    </label>

    <input
      type="text"
      class="chat-text-input"
      [(ngModel)]="newMessage"
      (input)="onTyping()"
      (keyup.enter)="sendMessage()"
      placeholder="اكتب رسالتك..."
    />

    <button class="chat-send-btn" (click)="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

</div>
