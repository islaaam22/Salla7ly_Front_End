<div class="d-flex flex-column h-100">
  <!-- Header -->
  <div class="d-flex align-items-center gap-3 px-4 py-3 border-bottom bg-white shadow-sm">
    <div
      class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white flex-shrink-0"
      style="width: 44px; height: 44px; background: #1aacdc; font-size: 18px"
    >
      {{ conversation.otherPartyName[0] }}
    </div>
    <div class="flex-grow-1">
      <div class="fw-semibold" style="color: #1a1a2e">{{ conversation.otherPartyName }}</div>
      <small class="text-muted" style="font-size: 12px">
        <span *ngIf="isTyping"> <i class="fa-regular fa-comment-dots"></i> جاري الكتابة... </span>
        <span *ngIf="!isTyping">متصل الآن</span>
      </small>
    </div>
  </div>

  <!-- Messages Area -->
  <div class="flex-grow-1 overflow-auto p-4 d-flex flex-column gap-2" style="background: #f0f2f5">
    <app-message-buddle *ngFor="let msg of messages" [message]="msg"> </app-message-buddle>

    <!-- Empty -->
    <div *ngIf="messages.length === 0" class="text-center text-muted my-auto">
      <i class="fa-regular fa-comment-dots"></i>
        ابدأ المحادثة
    </div>
  </div>

  <!-- Input -->
  <div class="px-4 py-3 border-top bg-white">
    <div class="d-flex align-items-center gap-2">
      <label
        class="btn btn-light border rounded-circle p-0 d-flex align-items-center justify-content-center flex-shrink-0"
        style="width: 40px; height: 40px"
        title="إرفاق ملف"
      >
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
        <input type="file" hidden (change)="onFileSelected($event)" />
      </label>

      <input
        type="text"
        class="form-control rounded-pill"
        [(ngModel)]="newMessage"
        (input)="onTyping()"
        (keyup.enter)="sendMessage()"
        placeholder="اكتب رسالتك..."
      />

      <button
        class="btn rounded-circle text-white d-flex align-items-center justify-content-center flex-shrink-0"
        style="width: 40px; height: 40px; background: #1aacdc"
        (click)="sendMessage()"
      >
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
