<div
  class="d-flex mb-1"
  [class.justify-content-start]="message.isRead"
  [class.justify-content-end]="!message.isRead"
>
  <div
    class="px-3 py-2 rounded-4 shadow-sm"
    style="max-width: 65%"
    [style.background]="message.isRead ? '#1AACDC' : '#ffffff'"
    [style.color]="message.isRead ? '#ffffff' : '#1A1A2E'"
  >
    <!-- Text -->
    <p class="mb-1" *ngIf="message.messageType === 0">
      {{ message.content }}
    </p>

    <!-- Image -->
    <img
      *ngIf="message.messageType === 1"
      [src]="message.attachmentUrls"
      class="rounded-3 img-fluid"
      style="max-width: 200px"
    />

    <!-- Voice -->
    <audio
      *ngIf="message.messageType === 2"
      [src]="message.attachmentUrls"
      controls
      class="w-100"
    ></audio>

    <!-- Time + Read -->
    <div class="d-flex align-items-center justify-content-end gap-1" style="margin-top: 2px">
      <small style="font-size: 10px; opacity: 0.7">
        {{ message.sentAt | date: 'shortTime' }}
      </small>
      <i class="fa-solid fa-check-double" *ngIf="message.isRead && message.isRead" style="font-size: 12px">
      </i>
    </div>
  </div>
</div>
