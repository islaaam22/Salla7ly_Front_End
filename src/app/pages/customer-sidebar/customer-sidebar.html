<aside
  class="d-flex flex-column bg-white vh-100 p-3 border-end"
  style="width: 280px; border-inline-end: 2px solid #e9ecef !important"
>
  <!-- Brand -->
  <div class="d-flex align-items-center justify-content-start gap-2 mb-4 pb-3 border-bottom">
    <span
      class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white"
      style="width: 38px; height: 38px"
      >🔧</span
    >
    <h4 class="fw-bold mb-0">صلّحلي</h4>
  </div>

  <!-- Nav -->
  <nav class="flex-grow-1">
    <ul class="nav flex-column gap-1">
      @for (item of navItems; track item.label) {
        <li class="nav-item">
          <a
            [routerLink]="item.link"
            routerLinkActive="active"
            class="nav-link d-flex align-items-center justify-content-start gap-2 text-dark px-3 py-2 rounded"
          >
            <span class="text-muted">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Footer -->
  <div class="mt-auto pt-4 border-top">
    <div class="d-flex align-items-center justify-content-start gap-2 mb-3 mt-3">
      <span
        class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary text-white fw-bold"
        style="width: 40px; height: 40px"
        >{{ userInitial }}</span
      >
      <div>
        <div class="fw-semibold">{{ userName }}</div>
        <div class="text-muted small">عميل</div>
      </div>
    </div>

    <button
      (click)="logout()"
      class="btn btn-light border w-100 d-flex align-items-center justify-content-center gap-2"
    >
      <span>→</span>
      <span>تسجيل الخروج</span>
    </button>
  </div>
</aside>
