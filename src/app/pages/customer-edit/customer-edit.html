<div class="edit-page" dir="rtl">

  <!-- loading -->
  <div *ngIf="loading" class="d-flex flex-column align-items-center justify-content-center py-5 gap-3">
    <div class="spinner-border" role="status" style="color:#E8620A">
      <span class="visually-hidden">جارٍ التحميل...</span>
    </div>
    <p class="text-muted">جاري التحميل...</p>
  </div>

  <!-- content -->
  <div *ngIf="!loading">

    <!-- Header -->
    <div class="text-end mb-4">
      <span class="edit-eyebrow">حسابي</span>
      <h1 class="edit-title">تعديل الملف الشخصي</h1>
      <p class="edit-sub">عدّل بياناتك الشخصية واحفظ التغييرات</p>
    </div>

    <!-- Back -->
    <div class="mb-4">
      <button class="edit-back-btn" (click)="goBack()">
        <i class="fa-solid fa-arrow-right"></i>
        رجوع للملف الشخصي
      </button>
    </div>

    <!-- Alerts -->
    <div *ngIf="successMsg" class="edit-alert edit-alert-success mb-4">
      <i class="fa-solid fa-circle-check"></i>
      {{ successMsg }}
    </div>

    <div *ngIf="validationErrors.length > 0" class="edit-alert edit-alert-danger mb-4">
      <ul class="mb-0 p-0" style="list-style:none">
        <li *ngFor="let msg of validationErrors" class="d-flex align-items-center gap-2 justify-content-end">
          <span>{{ msg }}</span>
          <i class="fa-solid fa-triangle-exclamation"></i>
        </li>
      </ul>
    </div>

    <div class="row g-4 align-items-start">

      <!-- FORM -->
      <div class="col-lg-8">
        <div class="edit-card">

          <div class="edit-card-header">
            <i class="fa-solid fa-user-pen"></i>
            البيانات الشخصية
          </div>

          <!-- Name -->
          <div class="edit-field">
            <label class="edit-label">
              <i class="fa-solid fa-address-card"></i>
              الاسم الكامل
            </label>
            <input
              type="text"
              class="edit-input"
              [(ngModel)]="name"
              name="name"
              placeholder="أدخل اسمك الكامل"
            />
          </div>

          <!-- Phone -->
          <div class="edit-field">
            <label class="edit-label">
              <i class="fa-solid fa-phone"></i>
              رقم الهاتف
            </label>
            <input
              type="text"
              class="edit-input"
              [(ngModel)]="phoneNumber"
              name="phoneNumber"
              placeholder="+20 100 000 0000"
              style="direction:ltr; text-align:right"
            />
          </div>

          <!-- Address -->
          <div class="edit-field">
            <label class="edit-label">
              <i class="fa-solid fa-location-dot"></i>
              العنوان
            </label>
            <input
              type="text"
              class="edit-input"
              [(ngModel)]="mainAddress"
              name="addressDetails"
              placeholder="مثال: المعادي، القاهرة"
            />
          </div>

          <!-- Actions -->
          <div class="d-flex gap-3 mt-2">
            <button class="edit-save-btn" (click)="save()" [disabled]="saving">
              <i class="fa-solid fa-floppy-disk"></i>
              {{ saving ? 'جارٍ الحفظ...' : 'حفظ التغييرات' }}
            </button>
            <button class="edit-cancel-btn" (click)="goBack()">
              إلغاء
            </button>
          </div>

        </div>
      </div>

      <!-- PREVIEW CARD -->
      <div class="col-lg-4">
        <div class="preview-card">

          <div class="preview-avatar">
            {{ initial }}
          </div>

          <h4 class="preview-name">{{ name || 'اسمك هنا' }}</h4>
          <span class="preview-role">عميل</span>

          <div class="preview-divider"></div>

          <div class="preview-email">
            <i class="fa-regular fa-envelope"></i>
            <span style="direction:ltr">{{ email }}</span>
          </div>

          <div class="preview-note">
            <i class="fa-solid fa-circle-info"></i>
            معاينة مباشرة لملفك الشخصي
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
