<div class="container-fluid vh-100 p-0">
  <div class="row h-100 m-0">

    <!-- Left Side -->
    <div class="col-6 d-flex justify-content-center align-items-center"
         style="background:#f5f7fa;">

      <div style="width:540px;" >

  <div class="mb-5">
    <h2 class="fw-bold text-end mb-1"
        style="font-size:33px;color:#0f172a;">
      تسجيل الدخول
    </h2>

    <p class="text-end text-muted"
       style="font-size:18px;">
      اختر نوع حسابك ثم أدخل بياناتك.
    </p>


  <!-- باقي الفورم -->
</div>
        <!-- Role Toggle -->
        <div class="d-flex mb-5 p-1 rounded-4"
             style="background:#e9eef4;border:1px solid #dbe3ea;height:60px;">

          <button
            class="btn flex-fill rounded-4 border-0 fw-semibold"
            [ngClass]="selectedRole === 'client' ? 'bg-white shadow-sm text-dark' : 'text-secondary bg-transparent'"
            (click)="selectRole('client')">
            <i class="fa-regular fa-user me-2"></i>
            عميل
          </button>

          <button
            class="btn flex-fill rounded-4 border-0 fw-semibold"
            [ngClass]="selectedRole === 'tech' ? 'bg-white shadow-sm text-dark' : 'text-secondary bg-transparent'"
            (click)="selectRole('tech')">
            <i class="fa-solid fa-toolbox me-2"></i>
            فني
          </button>

          <button
            class="btn flex-fill rounded-4 border-0 fw-semibold"
            [ngClass]="selectedRole === 'admin' ? 'bg-white shadow-sm text-dark' : 'text-secondary bg-transparent'"
            (click)="selectRole('admin')">
            <i class="fa-solid fa-shield me-2"></i>
            مشرف
          </button>

        </div>

        <form (ngSubmit)="onLogin()">

          <div class="mb-4">
            <label class="form-label fw-bold w-100 text-end mb-2">
              البريد الإلكتروني
            </label>

            <input
              type="email"
              class="form-control text-end"
              [(ngModel)]="email"
              name="email"
              placeholder="email@example.com"
              required
              style="height:60px;border-radius:18px;border:1px solid #d9e1e8;padding:0 24px;">

              <div *ngIf="emailError" class="text-danger small mt-1 text-end">{{ emailError }}</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold w-100 text-end mb-2">
              كلمة المرور
            </label>

            <input
              type="password"
              class="form-control text-end"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required
              style="height:60px;border-radius:18px;border:1px solid #d9e1e8;padding:0 24px;">
              <div *ngIf="passwordError" class="text-danger small mt-1 text-end">{{ passwordError }}</div>
        </div>

          <div *ngIf="errorMsg"
            class="alert alert-danger text-end">
            {{ errorMsg }}
          </div>

          <button
            type="submit"
            class="btn w-100 text-white fw-bold"
            [disabled]="loading"
            style="height:60px;border:none;border-radius:18px;font-size:20px;background:linear-gradient(90deg,#3eacdf,#4290d0);">

            {{ loading ? 'جاري الدخول...' : 'دخول' }}

          </button>

        </form>

        <p class="text-center mt-4"
          style="font-size:16px;">

          ليس لديك حساب؟

          <a
            routerLink="/register"
            class="text-primary fw-semibold text-decoration-none">

            إنشاء حساب جديد

          </a>

        </p>

      </div>

    </div>

    <!-- Right Side -->
    <div class="col-6 d-flex flex-column"
         style="background:linear-gradient(135deg,#1787e0 0%,#30aaaa 100%);padding:50px;">

      <!-- Logo -->
      <div class="d-flex justify-content-end align-items-center gap-3">

        <span class="text-white fw-bold"
              style="font-size:22px;">

          صلّحلي

        </span>

        <div class="rounded-circle d-flex justify-content-center align-items-center"
             style="width:42px;height:42px;background:rgba(255,255,255,.18);">

          <i class="fa-solid fa-wrench text-white"></i>

        </div>

      </div>

      <!-- Content -->
      <div class="my-auto text-end pe-5">

        <h1 class="text-white fw-bold mb-4"
            style="font-size:40px;line-height:1.1;">

          مرحباً بعودتك إلى
          <br>
          منصتك المفضلة

        </h1>

        <p class="text-white"
           style="font-size:22px;opacity:.9;line-height:1.8;">

        .سجّل الدخول وتابع طلباتك أو ابدأ طلباً جديداً بكل سهولة

        </p>

      </div>

      <!-- Footer -->
      <div class="text-end">

        <span class="text-white"
              style="opacity:.6;font-size:18px;">

          صلّحلي ٢٠٢٦ ©

        </span>

      </div>

    </div>

  </div>
</div>
