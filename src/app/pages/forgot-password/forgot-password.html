<div class="container-fluid vh-100 p-0">
  <div class="row h-100 m-0">

    <!-- Left Side: Form -->
    <div class="col-6 d-flex justify-content-center align-items-center"
         style="background:#f5f7fa;">

      <div style="width:540px;">

        <div class="mb-5">
          <h2 class="fw-bold text-end mb-1"
              style="font-size:33px;color:#0f172a;">
            استعادة كلمة المرور
          </h2>
          <p class="text-end text-muted" style="font-size:18px;">
            أدخل بريدك الإلكتروني وسنرسل لك رمز التحقق.
          </p>
        </div>

        <form (ngSubmit)="onSubmit()">

          <div class="mb-4">
            <label class="form-label fw-bold w-100 text-end mb-2">
              البريد الإلكتروني
            </label>
            <div class="input-group" style="direction:ltr;">
              <span class="input-group-text"
                    style="border-radius:18px 0 0 18px;border:1px solid #d9e1e8;
                           border-left:none;background:#fff;height:60px;">
                <i class="fa-regular fa-envelope text-muted"></i>
              </span>
              <input
                type="email"
                class="form-control text-end"
                [(ngModel)]="email"
                name="email"
                placeholder="email@example.com"
                required
                style="height:60px;border-radius:0 18px 18px 0;
                       border:1px solid #d9e1e8;border-right:none;padding:0 16px;">
            </div>
            <div *ngIf="emailError" class="text-danger small mt-1 text-end">
              {{ emailError }}
            </div>
          </div>

          <div *ngIf="successMsg"
               class="alert text-end"
               style="background:#e8fdf2;border:1px solid #a3e6c3;
                      color:#1a7a47;border-radius:14px;">
            <i class="fa-solid fa-circle-check me-2"></i>{{ successMsg }}
          </div>

          <div *ngIf="errorMsg"
               class="alert alert-danger text-end"
               style="border-radius:14px;">
            {{ errorMsg }}
          </div>

          <button
            type="submit"
            class="btn w-100 text-white fw-bold"
            [disabled]="loading"
            style="height:60px;border:none;border-radius:18px;font-size:20px;
                   background:linear-gradient(90deg,#3eacdf,#4290d0);">
            {{ loading ? 'جاري الإرسال...' : 'إرسال رمز التحقق' }}
          </button>

        </form>

        <p class="text-center mt-4" style="font-size:16px;">
          تذكرت كلمة المرور؟
          <a routerLink="/login" class="text-primary fw-semibold text-decoration-none">
            تسجيل الدخول
          </a>
        </p>

      </div>
    </div>

    <!-- Right Side: Branding Panel -->
    <div class="col-6 d-flex flex-column"
         style="background:linear-gradient(135deg,#1787e0 0%,#30aaaa 100%);padding:50px;">

      <div class="d-flex justify-content-end align-items-center gap-3">
        <span class="text-white fw-bold" style="font-size:22px;">صلّحلي</span>
        <div class="rounded-circle d-flex justify-content-center align-items-center"
             style="width:42px;height:42px;background:rgba(255,255,255,.18);">
          <i class="fa-solid fa-wrench text-white"></i>
        </div>
      </div>

      <div class="my-auto text-end pe-5">
        <h1 class="text-white fw-bold mb-4" style="font-size:40px;line-height:1.1;">
          نسيت كلمة المرور؟
          <br>لا تقلق، نحن هنا
        </h1>
        <p class="text-white" style="font-size:22px;opacity:.9;line-height:1.8;">
          .سنرسل لك رمزاً سرياً على بريدك لإعادة ضبط كلمة المرور
        </p>
      </div>

      <div class="text-end">
        <span class="text-white" style="opacity:.6;font-size:18px;">صلّحلي ٢٠٢٦ ©</span>
      </div>

    </div>

  </div>
</div>
