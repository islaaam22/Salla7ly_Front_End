<!-- Floating bubble -->
<button (click)="toggle()"
        class="position-fixed d-flex align-items-center justify-content-center shadow-lg"
        style="bottom:24px; left:24px; width:60px; height:60px; border-radius:50%; border:none; background:#f26419; color:#fff; z-index:1090;">
  <i class="fa-solid" [class.fa-comment-dots]="!isOpen()" [class.fa-xmark]="isOpen()" style="font-size:24px;"></i>
</button>

<!-- Chat window -->
<div *ngIf="isOpen()"
     class="position-fixed shadow-lg bg-white d-flex flex-column"
     style="bottom:96px; left:24px; width:360px; max-width:92vw; height:480px; max-height:70vh; border-radius:16px; overflow:hidden; z-index:1090; border:1px solid #e6e2d6;"
     dir="rtl">

  <!-- header -->
  <div class="d-flex align-items-center gap-2 p-3" style="background:#1a1f2e; color:#fff;">
    <span class="d-inline-flex align-items-center justify-content-center rounded-circle"
          style="width:38px; height:38px; background:#f26419;">
      <i class="fa-solid fa-headset"></i>
    </span>
    <div>
      <div class="fw-bold" style="font-size:15px;">مساعد صلّحلي</div>
      <div style="font-size:12px; opacity:.7;">متصل الآن</div>
    </div>
  </div>

  <!-- messages -->
  <div class="flex-grow-1 p-3" style="overflow-y:auto; background:#f7f5f0;">
    <div *ngFor="let m of messages()"
         class="d-flex mb-2"
         [class.justify-content-start]="m.role === 'assistant'"
         [class.justify-content-end]="m.role === 'user'">
      <div class="p-2 px-3"
           style="max-width:80%; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap;"
           [style.background]="m.role === 'user' ? '#f26419' : '#ffffff'"
           [style.color]="m.role === 'user' ? '#fff' : '#1a1f2e'"
           [style.border]="m.role === 'assistant' ? '1px solid #e6e2d6' : 'none'">
        {{ m.content }}
      </div>
    </div>

    <div *ngIf="loading()" class="d-flex justify-content-start mb-2">
      <div class="p-2 px-3" style="background:#fff; border:1px solid #e6e2d6; border-radius:14px; font-size:14px; color:#8a8f9a;">
        ...يكتب
      </div>
    </div>
  </div>

  <!-- input -->
  <div class="d-flex gap-2 p-2" style="border-top:1px solid #e6e2d6; background:#fff;">
    <input [(ngModel)]="input"
           (keyup.enter)="send()"
           [disabled]="loading()"
           placeholder="اكتب سؤالك..."
           class="form-control"
           style="border-radius:20px; font-size:14px;" />
    <button (click)="send()"
            [disabled]="loading()"
            class="btn d-flex align-items-center justify-content-center"
            style="background:#f26419; color:#fff; border-radius:50%; width:42px; height:42px; flex-shrink:0;">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

</div>
