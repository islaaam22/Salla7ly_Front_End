<div class="wallet-page" dir="rtl">


  <!-- Header -->
  <div class="wallet-header">
    <h1 class="wallet-title">المحفظة</h1>
    <p class="wallet-sub">إدارة رصيدك ومعاملاتك المالية</p>
  </div>

  <!-- Top Row -->
  <div class="wallet-top-grid">

    <!-- Balance Card -->
    <div class="balance-card">
      <div class="balance-card-top">
        <span class="balance-label">الرصيد الحالي</span>
        <div class="balance-value">{{ balance | number:'1.0-0' }} <span>ج.م</span></div>
      </div>
      <div class="balance-btns">
        <button class="btn-charge" (click)="openTopUpModal()">
          <i class="fa-solid fa-plus"></i>
          شحن الرصيد
        </button>
        <button class="btn-payment-methods">
          <i class="fa-solid fa-credit-card"></i>
          طرق الدفع
        </button>
      </div>
    </div>

    <!-- Virtual Card -->
    <div class="virtual-card">
      <div class="virtual-card-icon">
        <i class="fa-regular fa-credit-card"></i>
      </div>
      <div class="virtual-card-info">
        <h6 class="virtual-card-title">بطاقة افتراضية</h6>
        <p class="virtual-card-num" dir="ltr">**** **** **** 4343</p>
      </div>
      <a href="#" class="virtual-card-link">إدارة البطاقات</a>
    </div>

  </div>

  <!-- Transactions -->
  <div class="transactions-card">
    <h3 class="transactions-title">آخر المعاملات</h3>

    <div *ngFor="let tx of transactions" class="tx-item">
      <div
        class="tx-icon"
        [style.background]="tx.type === 'in' ? '#e1f5ee' : '#fef2f2'"
        [style.color]="tx.type === 'in' ? '#10b981' : '#e74c3c'"
      >
        <i
          class="fa-solid"
          [class.fa-down-left-and-up-right-to-center]="tx.type === 'in'"
          [class.fa-up-right-and-down-left-from-center]="tx.type !== 'in'"
        ></i>
      </div>
      <div class="tx-info">
        <div class="tx-title">{{ tx.title }}</div>
        <small class="tx-date">{{ tx.date }}</small>
      </div>
      <span class="tx-amount" [class.tx-in]="tx.type === 'in'" [class.tx-out]="tx.type !== 'in'">
        {{ tx.type === 'in' ? '+' : '-' }}{{ tx.amount }} ج.م
      </span>
    </div>

    <div *ngIf="transactions.length === 0" class="tx-empty">
      <i class="fa-regular fa-clock"></i>
      لا توجد معاملات حتى الآن
    </div>
  </div>

  <!-- Top Up Modal -->
  <div class="modal-overlay" *ngIf="showTopUpModal">
    <div class="modal-box">

      <div class="modal-header">
        <button class="modal-close" (click)="closeTopUpModal()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h5 class="modal-title">شحن الرصيد</h5>
      </div>

      <!-- Quick amounts -->
      <div class="quick-amounts">
        <button
          *ngFor="let amt of quickAmounts"
          class="quick-amount-btn"
          [class.selected]="topUpAmount === amt"
          (click)="topUpAmount = amt"
        >
          {{ amt }} ج
        </button>
      </div>

      <div class="modal-field">
        <label class="modal-label">أو أدخل مبلغاً آخر (ج.م)</label>
        <input
          type="number"
          class="modal-input"
          [(ngModel)]="topUpAmount"
          placeholder="مثال: 100"
        />
      </div>

      <button class="btn-confirm-charge">
        <i class="fa-solid fa-plus"></i>
        تأكيد الشحن
      </button>

    </div>
  </div>

</div>
