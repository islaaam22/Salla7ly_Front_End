<div class="container py-4" dir="rtl">

  <div class="text-center mb-5">
    <h2 class="fw-bold">العروض المستلمة</h2>
    <p class="text-muted">قارن بين عروض الفنيين واختر الأنسب لك</p>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3 text-muted">جاري التحميل...</p>
  </div>

  <div *ngIf="!isLoading && groupedRequests.length === 0" class="text-center py-5">
    <p class="text-muted fs-5">لا توجد طلبات مفتوحة حالياً</p>
  </div>

  <!-- Category Card (واحد لكل كاتيجوري) -->
  <div class="row g-3">
    <div *ngFor="let group of groupedRequests" class="col-12">
      <div
        class="card border-0 shadow-sm rounded-4 px-4 py-3 request-card"
        (click)="goToCategory(group)"
        style="cursor: pointer;"
      >
        <div class="d-flex align-items-center justify-content-between">

          <div class="d-flex align-items-center gap-3">
            <div class="request-icon bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center">
              <i class="fa-solid fa-wrench text-primary fs-5"></i>
            </div>

            <div>
              <h6 class="fw-bold mb-1">{{ group.category.name }}</h6>
              <small class="text-muted">
                {{ group.requests.length }} طلب
              </small>
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="text-center">
              <div class="fw-bold fs-4 text-primary lh-1">
                {{ getBidCount(group.requests) }}
              </div>
              <small class="text-muted">عرض</small>
            </div>

            <span class="live-dot"></span>
            <i class="fa-solid fa-chevron-left text-muted"></i>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
